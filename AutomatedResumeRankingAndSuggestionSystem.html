<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Analyzer</title>
    
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* LOGIN & DASHBOARD BOX */
        .auth-container, .dashboard-container {
            background: white;
            padding: 40px;
            width: 400px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        .dashboard-container {
            display: none;
            width: 850px;
        }

        /* INPUT */
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        /* BUTTON */
        button {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        .google-btn {
            background: #db4437;
        }

        .divider {
            margin: 15px 0;
            font-weight: bold;
        }

        /* DASHBOARD */
        .upload-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .result-section {
            display: flex;
            gap: 20px;
        }

        .score-card, .suggestions {
            flex: 1;
            background: #f4f6f9;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
        }

        .logout-btn {
            background: red;
            margin-top: 20px;
        }

        .stars {
            font-size: 28px;
            margin-top: 10px;
            color: gold;
        }

        /* PROFESSIONAL SUGGESTIONS */
        .suggestion-item {
            background: #eafaf1;
            padding: 10px;
            margin: 8px 0;
            border-left: 5px solid #27ae60;
            border-radius: 5px;
            font-size: 14px;
        }

        .good {
            background: #d4edda;
            padding: 12px;
            border-radius: 6px;
            color: #155724;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="auth-container" id="loginPage">
    <h1>AI Resume Analyzer</h1>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div class="divider">OR</div>

    <button class="google-btn" onclick="googleLogin()">
        Login with Google
    </button>

    <p>Don't have an account?
        <a href="#" onclick="signup()">Sign Up</a>
    </p>
</div>

<div class="dashboard-container" id="dashboardPage">
    <h2>Resume Analyzer Dashboard</h2>

    <div class="upload-box">
        <input type="file" id="resumeFile" accept=".pdf,.txt">
        <button onclick="analyzeResume()">Analyze Resume</button>
    </div>

    <div class="result-section">
        <div class="score-card" id="scoreCard"></div>
        <div class="suggestions" id="suggestions"></div>
    </div>

    <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>

<script>
// LOGIN
function login(){
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if(user === "" || pass === ""){
        alert("Enter credentials");
        return;
    }

    document.getElementById("loginPage").style.display = "none";
    document.getElementById("dashboardPage").style.display = "block";
}

// GOOGLE LOGIN (Improved)
function googleLogin(){
    let email = prompt("Enter your Google Gmail address:");

    if(email === null || email.trim() === ""){
        alert("Google login cancelled");
        return;
    }

    if(!email.endsWith("@gmail.com")){
        alert("Please enter valid Gmail address");
        return;
    }

    alert("Login Successful: " + email);

    document.getElementById("loginPage").style.display = "none";
    document.getElementById("dashboardPage").style.display = "block";
}

// SIGNUP
function signup(){
    alert("Signup Successful (Demo)");
}

// LOGOUT
function logout(){
    document.getElementById("dashboardPage").style.display = "none";
    document.getElementById("loginPage").style.display = "block";
}

// ANALYZE RESUME
async function analyzeResume(){
    const file = document.getElementById("resumeFile").files[0];

    if(!file){
        alert("Upload resume first");
        return;
    }

    let text = "";

    if(file.type === "text/plain"){
        text = await file.text();
    }
    else if(file.type === "application/pdf"){
        text = await extractPDFText(file);
    }
    else{
        alert("Unsupported file format");
        return;
    }

    generateScore(text);
}

// EXTRACT PDF TEXT
async function extractPDFText(file){
    const reader = new FileReader();

    return new Promise((resolve)=>{
        reader.onload = async function(){
            const typedarray = new Uint8Array(this.result);
            const pdf = await pdfjsLib.getDocument(typedarray).promise;

            let fullText = "";

            for(let i=1; i<=pdf.numPages; i++){
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                const strings = content.items.map(item => item.str);
                fullText += strings.join(" ");
            }

            resolve(fullText);
        };
        reader.readAsArrayBuffer(file);
    });
}

// GENERATE SCORE + STAR RATING
function generateScore(text){
    let score = 0;
    let suggestions = [];

    text = text.toLowerCase();

    const skills = ["java","python","javascript","react","node","c++"];
    let skillCount = skills.filter(skill => text.includes(skill)).length;

    score += skillCount * 10;

    if(skillCount < 3)
        suggestions.push("Add more technical skills to strengthen your resume.");

    if(text.includes("project"))
        score += 15;
    else
        suggestions.push("Include detailed project section with technologies used.");

    if(text.includes("experience"))
        score += 20;
    else
        suggestions.push("Mention internships or work experience.");

    if(text.includes("certificate"))
        score += 10;
    else
        suggestions.push("Add certifications to improve credibility.");

    if(text.includes("cgpa"))
        score += 10;
    else
        suggestions.push("Mention your CGPA or academic performance.");

    if(score > 100) score = 100;

    let stars = getStarRating(score);

    document.getElementById("scoreCard").innerHTML =
        "<h3>Resume Score</h3>" +
        "<h1>" + score + " / 100</h1>" +
        "<div class='stars'>" + stars + "</div>";

    let suggestionHTML = "<h3>Improvement Suggestions</h3>";

    if(suggestions.length === 0){
        suggestionHTML += "<div class='good'>Excellent Resume! No major improvements needed.</div>";
    }
    else{
        suggestions.forEach(item => {
            suggestionHTML += "<div class='suggestion-item'>✔ " + item + "</div>";
        });
    }

    document.getElementById("suggestions").innerHTML = suggestionHTML;
}

// STAR LOGIC
function getStarRating(score){
    let starCount = 0;

    if(score <= 20) starCount = 1;
    else if(score <= 40) starCount = 2;
    else if(score <= 60) starCount = 3;
    else if(score <= 80) starCount = 4;
    else starCount = 5;

    let stars = "";

    for(let i=0;i<5;i++){
        if(i < starCount)
            stars += "⭐";
        else
            stars += "☆";
    }

    return stars;
}
</script>

</body>
</html>
